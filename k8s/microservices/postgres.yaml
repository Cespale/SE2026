apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-ms-data
  namespace: streamhub-ms
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-ms
  namespace: streamhub-ms
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres-ms
  template:
    metadata:
      labels:
        app: postgres-ms
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: streamhub-ms-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: streamhub-ms-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: [sh, -c, "pg_isready -U postgres -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [sh, -c, "pg_isready -U postgres -d $POSTGRES_DB"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-ms-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-ms
  namespace: streamhub-ms
spec:
  type: ClusterIP
  selector:
    app: postgres-ms
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
