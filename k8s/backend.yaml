apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamhub-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streamhub-backend
  template:
    metadata:
      labels:
        app: streamhub-backend
    spec:
      containers:
        - name: backend
          image: streamhub-backend:VERSION_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: streamhub-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: streamhub-secrets
                  key: SECRET_KEY
          readinessProbe:
            httpGet:
              path: /openapi.json
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: streamhub-backend
spec:
  selector:
    app: streamhub-backend
  ports:
    - port: 8000
      targetPort: 8000
