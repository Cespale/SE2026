apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamhub-srs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: streamhub-srs
  template:
    metadata:
      labels:
        app: streamhub-srs
    spec:
      containers:
        - name: srs
          image: ossrs/srs:5
          imagePullPolicy: IfNotPresent
          ports:
            - name: rtmp
              containerPort: 1935
            - name: flv
              containerPort: 8080
            - name: api
              containerPort: 1985
          readinessProbe:
            tcpSocket:
              port: rtmp
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: flv
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: streamhub-srs
spec:
  selector:
    app: streamhub-srs
  ports:
    - name: rtmp
      port: 1935
      targetPort: rtmp
    - name: flv
      port: 8080
      targetPort: flv
    - name: api
      port: 1985
      targetPort: api
