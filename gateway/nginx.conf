worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_x_request_id $streamhub_request_id {
        default $http_x_request_id;
        "" $request_id;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    resolver 127.0.0.11 ipv6=off valid=10s;

    upstream user_service {
        zone user_service 64k;
        server user-service:8000 resolve;
    }

    upstream content_service {
        zone content_service 64k;
        server content-service:8000 resolve;
    }

    upstream social_service {
        zone social_service 64k;
        server social-service:8000 resolve;
    }

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Request-ID $streamhub_request_id;
        proxy_hide_header X-Request-ID;
        proxy_set_header Host $host;
        proxy_connect_timeout 500ms;
        proxy_read_timeout 2s;
        proxy_send_timeout 2s;
        proxy_next_upstream off;
        proxy_intercept_errors on;
        error_page 502 503 504 = @service_unavailable;

        add_header X-Request-ID $streamhub_request_id always;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Request-ID" always;
        add_header Access-Control-Allow-Methods "GET,HEAD,POST,PUT,PATCH,DELETE,OPTIONS" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        location = /ready {
            default_type application/json;
            return 200 '{"status":"ready","service":"gateway"}';
        }

        location = /version {
            default_type application/json;
            return 200 '{"service":"gateway","version":"__APP_VERSION__"}';
        }

        location = /api/health {
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        location = /internal {
            return 404;
        }

        location ^~ /internal/ {
            return 404;
        }

        location ~ ^/_services/user/(health|ready|version)$ {
            rewrite ^/_services/user/(health|ready|version)$ /$1 break;
            proxy_pass http://user_service;
        }

        location ~ ^/_services/content/(health|ready|version)$ {
            rewrite ^/_services/content/(health|ready|version)$ /$1 break;
            proxy_pass http://content_service;
        }

        location ~ ^/_services/social/(health|ready|version)$ {
            rewrite ^/_services/social/(health|ready|version)$ /$1 break;
            proxy_pass http://social_service;
        }

        location ^~ /uploads/ {
            proxy_pass http://content_service;
        }

        location ^~ /avatars/ {
            proxy_pass http://user_service;
        }

        location = /ws/chat {
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Request-ID $streamhub_request_id;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_pass http://user_service;
        }

        location ~ ^/ws/live/ {
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Request-ID $streamhub_request_id;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_pass http://social_service;
        }

        # 交互路由必须先于通用视频路由。
        location ~ ^/api/videos/[^/]+/(like|like-status|favorite|comments|danmaku)(/.*)?$ {
            proxy_pass http://social_service;
        }

        location ^~ /api/comments/ {
            proxy_pass http://social_service;
        }

        # 用户子资源必须先于通用用户路由；通用路由不能使用 ^~。
        location ~ ^/api/users/[^/]+/videos/?$ {
            proxy_pass http://content_service;
        }

        location ~ ^/api/users/[^/]+/likes/?$ {
            proxy_pass http://social_service;
        }

        location ^~ /api/auth/ {
            # bcrypt 在受限 CPU 下可能超过全局 2 秒；仅认证路由放宽。
            proxy_read_timeout 10s;
            proxy_pass http://user_service;
        }

        location ^~ /api/notifications {
            proxy_pass http://user_service;
        }

        location ^~ /api/chat/ {
            proxy_pass http://user_service;
        }

        location ^~ /api/admin/users {
            proxy_pass http://user_service;
        }

        location = /api/creator/fans {
            proxy_pass http://user_service;
        }

        location /api/users/ {
            proxy_pass http://user_service;
        }

        location ^~ /api/categories {
            proxy_pass http://content_service;
        }

        location ^~ /api/feed {
            proxy_pass http://content_service;
        }

        location ^~ /api/admin/videos {
            proxy_pass http://content_service;
        }

        location ^~ /api/admin/local-videos {
            proxy_pass http://content_service;
        }

        location = /api/admin/cleanup-uploads {
            proxy_pass http://content_service;
        }

        location ^~ /api/creator/videos {
            proxy_pass http://content_service;
        }

        location = /api/creator/week-stats {
            proxy_pass http://content_service;
        }

        location = /api/videos/upload-file {
            client_max_body_size 512m;
            proxy_request_buffering off;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            proxy_pass http://content_service;
        }

        location = /api/videos/upload-cover {
            client_max_body_size 6m;
            proxy_request_buffering off;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_pass http://content_service;
        }

        location /api/videos {
            proxy_pass http://content_service;
        }

        location ^~ /api/live/ {
            proxy_pass http://social_service;
        }

        location = /api/reports {
            proxy_pass http://social_service;
        }

        location ^~ /api/admin/reports {
            proxy_pass http://social_service;
        }

        location ^~ /api/admin/sensitive-words {
            proxy_pass http://social_service;
        }

        location ^~ /api/admin/live-rooms {
            proxy_pass http://social_service;
        }

        location ^~ /api/creator/comments {
            proxy_pass http://social_service;
        }

        location = /api/creator/active-room {
            proxy_pass http://social_service;
        }

        location @service_unavailable {
            default_type application/json;
            return 503 '{"detail":"上游服务暂不可用"}';
        }

        location / {
            default_type application/json;
            return 404 '{"detail":"接口不存在"}';
        }
    }
}
