name: StreamHub CI/CD

# ── runner 切换开关 ─────────────────────────────────────────────
# 在仓库 Settings → Secrets and variables → Actions → Variables 配置
# （不配置则用默认值，无需任何改动即可保持现状）：
#   TEST_RUNNER   = ubuntu-latest 或 self-hosted   （默认 self-hosted，控制两个测试 job）
#   DEPLOY_RUNNER = ubuntu-latest 或 self-hosted   （默认 self-hosted，控制部署 job）
# 例：测试在自托管上太慢时，把 TEST_RUNNER 改成 ubuntu-latest 即可整体切换，不用改代码。
# 注意：部署 job 切到 ubuntu-latest 时，下方会自动多跑一个「安装 kubectl」步骤。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1 · 后端单元 + API 集成测试 ──────────────────────────────
  test-backend:
    name: 1 · 后端单元/集成测试
    runs-on: ${{ vars.TEST_RUNNER || 'self-hosted' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: streamhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d streamhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装后端依赖
        run: pip install -r backend/requirements.txt pytest httpx
      - name: 预建应用上传目录（main.py 用绝对路径 /app/...）
        run: |
          sudo mkdir -p /app/public/uploads/videos /app/public/uploads/covers /app/public/avatars
          sudo chmod -R 777 /app
      - name: 运行后端测试
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/streamhub
        run: |
          cd backend
          pytest -q

  # ── 2 · 前端类型检查 + 编译 + E2E ──────────────────────────
  test-frontend:
    name: 2 · 前端类型检查 + 编译 + E2E
    runs-on: ${{ vars.TEST_RUNNER || 'self-hosted' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: streamhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d streamhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # E2E 里 playwright 会拉起 FastAPI：后端要连 Postgres，且 security.py 要求 SECRET_KEY
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/streamhub
      SECRET_KEY: streamhub-e2e-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装后端依赖（E2E 需要启动 FastAPI）
        run: pip install -r backend/requirements.txt
      - name: 预建应用上传目录（main.py 用绝对路径 /app/...）
        run: |
          sudo mkdir -p /app/public/uploads/videos /app/public/uploads/covers /app/public/avatars
          sudo chmod -R 777 /app
      - name: 安装前端依赖
        run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: 编译
        run: npm run build
      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium
      - name: 前端 E2E 测试
        run: npm test

  # ── 3 · 制作镜像（带版本号）→ 部署 K8s → 健康检查 ──────────
  # needs 保证：只要 1、2 任一步失败，本 job 不会执行，即「测试失败停流水线」。
  build-deploy:
    name: 3 · 制作镜像 + 部署 K8s + 健康检查
    needs: [test-backend, test-frontend]
    # 只在 push（推 fork / 合并进 main）时部署。PR 事件——尤其 fork PR——拿不到
    # secrets，部署 job 会因 POSTGRES_PASSWORD/SECRET_KEY 为空而失败，故 PR 上跳过。
    if: github.event_name == 'push'
    runs-on: ${{ vars.DEPLOY_RUNNER || 'self-hosted' }}
    env:
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: 创建 Kind 集群
        uses: helm/kind-action@v1.10.0
        with:
          # 默认集群名是 chart-testing，这里显式改成 kind，
          # 否则后续 `kind load docker-image` 会报 no nodes found for cluster "kind"
          cluster_name: kind

      - name: 制作镜像（带版本号，禁止 latest）
        run: |
          VERSION=${GITHUB_SHA:0:8}
          docker build -f backend/Dockerfile -t streamhub-backend:${VERSION} .
          docker build -f Dockerfile.frontend -t streamhub-frontend:${VERSION} .
          kind load docker-image --name kind streamhub-backend:${VERSION}
          kind load docker-image --name kind streamhub-frontend:${VERSION}

      - name: 预加载 postgres 镜像到 kind
        run: |
          set -o pipefail
          # kind load 对 postgres:16（多平台 manifest list）内部用 ctr import --all-platforms，
          # 而 docker save 只导出当前架构的 layer → 其余平台内容缺失 → "content digest not found"
          # （后端/前端是本机构建的单平台镜像，所以 kind load 一直正常）。
          # 节点又不能直连 Docker Hub（ctr pull 卡在 resolving）。
          # 绕开：手动 docker save，再用不带 --all-platforms 的 ctr import，只导入当前架构内容。
          docker pull postgres:16
          docker save postgres:16 | docker exec -i kind-control-plane ctr --namespace=k8s.io images import -

      - name: 安装 kubectl（若不存在；托管 runner 上需要，自托管通常已装则跳过）
        run: |
          if command -v kubectl >/dev/null 2>&1; then
            echo "kubectl 已存在，跳过安装"
          else
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/kubectl
          fi

      - name: 部署到 Kubernetes
        run: |
          export VERSION=${GITHUB_SHA:0:8}
          bash scripts/deploy.sh

      - name: 健康检查
        run: bash scripts/health-check.sh
